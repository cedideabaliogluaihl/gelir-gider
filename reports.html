<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f4e78">
<title>Gelir Gider - Raporlar</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fa;
    color:#17202a;
}

.header{
    background:#1f4e78;
    color:white;
    padding:22px 30px;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.title{
    font-size:28px;
    font-weight:bold;
}

.subtitle{
    margin-top:5px;
    opacity:.9;
    font-size:14px;
}

.home-btn{
    background:transparent;
    color:white;
    border:1px solid rgba(255,255,255,.6);
    padding:11px 18px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

.home-btn:hover{
    background:rgba(255,255,255,.12);
}

.auth-bar{
    background:#eef6ff;
    border-bottom:1px solid #d6e2ef;
    padding:12px 20px;
    text-align:center;
    font-size:17px;
}

.auth-bar button{
    margin-left:15px;
    padding:9px 18px;
    border:1px solid #1f4e78;
    background:white;
    color:#1f4e78;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:28px auto;
    padding:0 20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.card h2{
    margin:0 0 16px;
    font-size:20px;
}

.filters{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
}

.filter label{
    display:block;
    margin-bottom:7px;
    color:#617080;
    font-size:14px;
}

.filter select{
    width:100%;
    padding:13px;
    border:1px solid #cbd5df;
    border-radius:8px;
    background:white;
    font-size:15px;
}

.loading{
    text-align:center;
    padding:35px;
    font-size:18px;
}

.error{
    background:#fff0f0;
    color:#b42318;
    border:1px solid #f2b8b5;
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
}

.summary-box{
    background:white;
    border-radius:14px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    border-left:5px solid #1f4e78;
}

.summary-box.green{
    border-left-color:#20a35a;
}

.summary-box.red{
    border-left-color:#e64b4b;
}

.summary-box.blue{
    border-left-color:#3987c9;
}

.summary-box.yellow{
    border-left-color:#d6a500;
}

.summary-title{
    color:#687684;
    font-size:14px;
    margin-bottom:8px;
}

.summary-value{
    font-size:22px;
    font-weight:bold;
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:5px;
}

.section-subtitle{
    color:#687684;
    margin-bottom:16px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    padding:13px 10px;
    color:#687684;
    font-size:14px;
    border-bottom:1px solid #e1e7ed;
}

td{
    padding:13px 10px;
    border-bottom:1px solid #edf0f3;
}

.amount{
    text-align:right;
    font-weight:bold;
    white-space:nowrap;
}

.income{
    color:#159447;
}

.expense{
    color:#d13d3d;
}

.month-row{
    cursor:pointer;
}

.month-row:hover{
    background:#f7fafc;
}

.type-badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.type-income{
    background:#e6f7ed;
    color:#168c46;
}

.type-expense{
    background:#fdeaea;
    color:#c13737;
}

.empty{
    text-align:center;
    padding:30px;
    color:#687684;
}

.login-box{
    max-width:600px;
    margin:70px auto;
    text-align:center;
}

.login-box h2{
    margin-bottom:10px;
}

.login-btn{
    margin-top:20px;
    background:#1f4e78;
    color:white;
    border:0;
    padding:12px 22px;
    border-radius:7px;
    cursor:pointer;
    font-size:16px;
}

.debug{
    background:#f7f7f7;
    border:1px solid #ddd;
    padding:12px;
    border-radius:8px;
    margin-top:15px;
    font-size:13px;
    color:#555;
}

@media(max-width:850px){
    .summary{
        grid-template-columns:1fr 1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){
    .summary{
        grid-template-columns:1fr;
    }

    .header-inner{
        flex-direction:column;
        align-items:flex-start;
    }

    table{
        font-size:13px;
    }

    th,td{
        padding:9px 5px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div>
            <div class="title">Raporlar</div>
            <div class="subtitle">Geçmiş ayları ve kategorileri incele</div>
        </div>

        <button class="home-btn" onclick="location.href='index.html'">
            ← Ana Sayfa
        </button>
    </div>
</header>

<div class="auth-bar" id="authBar">
    Firebase bağlantısı kontrol ediliyor...
</div>

<main class="container" id="mainContent">

    <div class="loading" id="loading">
        Veriler Firebase'den yükleniyor...
    </div>

    <div id="errorBox" class="error" style="display:none;"></div>

    <div id="reportArea" style="display:none;">

        <section class="card">

            <h2>Filtre</h2>

            <div class="filters">

                <div class="filter">
                    <label for="typeFilter">Tür</label>

                    <select id="typeFilter">
                        <option value="Gelir">Gelir</option>
                        <option value="Gider">Gider</option>
                        <option value="Tümü">Tümü</option>
                    </select>
                </div>

                <div class="filter">
                    <label for="categoryFilter">Kategori</label>

                    <select id="categoryFilter">
                        <option value="Tümü">Tüm Kategoriler</option>
                    </select>
                </div>

                <div class="filter">
                    <label for="periodFilter">Dönem</label>

                    <select id="periodFilter">
                        <option value="Tümü">Tüm Dönem</option>
                    </select>
                </div>

            </div>

        </section>

        <section class="summary">

            <div class="summary-box green">
                <div class="summary-title">Seçilen Toplam</div>
                <div class="summary-value" id="totalValue">₺0,00</div>
            </div>

            <div class="summary-box red">
                <div class="summary-title">Aylık Ortalama</div>
                <div class="summary-value" id="averageValue">₺0,00</div>
            </div>

            <div class="summary-box blue">
                <div class="summary-title">En Yüksek Ay</div>
                <div class="summary-value" id="highestMonth">-</div>
            </div>

            <div class="summary-box yellow">
                <div class="summary-title">İşlem Sayısı</div>
                <div class="summary-value" id="transactionCount">0</div>
            </div>

        </section>

        <section class="card" style="margin-top:20px;">

            <div class="section-title">Aylık Dağılım</div>

            <div class="section-subtitle" id="distributionSubtitle">
                Gelir - Tüm Dönem
            </div>

            <div id="monthlyTable"></div>

        </section>

        <section class="card">

            <div class="section-title">İşlemler</div>

            <div style="overflow-x:auto;">
                <table>

                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Açıklama</th>
                            <th>Kategori</th>
                            <th>Tür</th>
                            <th class="amount">Tutar</th>
                        </tr>
                    </thead>

                    <tbody id="transactionTable"></tbody>

                </table>
            </div>

        </section>

        <section class="card">

            <div class="section-title">Veri Kontrolü</div>

            <div id="debugInfo" class="debug"></div>

        </section>

    </div>

</main>

<script type="module">

import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   FIREBASE AYARLARI
   ========================================================= */

const firebaseConfig = {

    apiKey: "AIzaSyC8Pk7DCPwmb5RK2NQCBPEv692-lzeeo4c",

    authDomain:
        "gelir-gider-546b4.firebaseapp.com",

    projectId:
        "gelir-gider-546b4",

    storageBucket:
        "gelir-gider-546b4.firebasestorage.app",

    messagingSenderId:
        "682384311790",

    appId:
        "1:682384311790:web:2ba8621cec98145232faff"
};


/* =========================================================
   FIREBASE BAŞLAT
   ========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* =========================================================
   GLOBAL VERİ
   ========================================================= */

let allItems = [];


/* =========================================================
   ELEMENTLER
   ========================================================= */

const authBar =
    document.getElementById("authBar");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const reportArea =
    document.getElementById("reportArea");

const typeFilter =
    document.getElementById("typeFilter");

const categoryFilter =
    document.getElementById("categoryFilter");

const periodFilter =
    document.getElementById("periodFilter");

const totalValue =
    document.getElementById("totalValue");

const averageValue =
    document.getElementById("averageValue");

const highestMonth =
    document.getElementById("highestMonth");

const transactionCount =
    document.getElementById("transactionCount");

const monthlyTable =
    document.getElementById("monthlyTable");

const transactionTable =
    document.getElementById("transactionTable");

const distributionSubtitle =
    document.getElementById("distributionSubtitle");

const debugInfo =
    document.getElementById("debugInfo");


/* =========================================================
   PARA FORMAT
   ========================================================= */

function money(value){

    const number =
        Number(value) || 0;

    return number.toLocaleString("tr-TR",{
        style:"currency",
        currency:"TRY",
        minimumFractionDigits:2
    });
}


/* =========================================================
   TARİH
   ========================================================= */

function formatDate(dateString){

    if(!dateString){
        return "-";
    }

    const parts =
        String(dateString).split("-");

    if(parts.length !== 3){
        return dateString;
    }

    return `${parts[2]}.${parts[1]}.${parts[0]}`;
}


/* =========================================================
   AY ADI
   ========================================================= */

const monthNames = [
    "Ocak",
    "Şubat",
    "Mart",
    "Nisan",
    "Mayıs",
    "Haziran",
    "Temmuz",
    "Ağustos",
    "Eylül",
    "Ekim",
    "Kasım",
    "Aralık"
];


function monthLabel(key){

    const parts =
        key.split("-");

    if(parts.length !== 2){
        return key;
    }

    const year =
        Number(parts[0]);

    const month =
        Number(parts[1]);

    return `${monthNames[month - 1]} ${year}`;
}


/* =========================================================
   HATA GÖSTER
   ========================================================= */

function showError(message){

    loading.style.display = "none";

    reportArea.style.display = "none";

    errorBox.style.display = "block";

    errorBox.innerHTML = `
        <strong>Hata:</strong><br>
        ${message}
    `;
}


/* =========================================================
   KATEGORİLERİ DOLDUR
   ========================================================= */

function fillCategories(){

    const categories =
        [...new Set(
            allItems
                .map(item => item.category)
                .filter(Boolean)
        )]
        .sort((a,b) =>
            String(a).localeCompare(
                String(b),
                "tr"
            )
        );

    categoryFilter.innerHTML =
        `<option value="Tümü">Tüm Kategoriler</option>`;

    categories.forEach(category => {

        const option =
            document.createElement("option");

        option.value = category;

        option.textContent = category;

        categoryFilter.appendChild(option);
    });
}


/* =========================================================
   DÖNEMLERİ DOLDUR
   ========================================================= */

function fillPeriods(){

    const periods =
        [...new Set(
            allItems
                .map(item => {

                    if(!item.date){
                        return null;
                    }

                    return String(item.date)
                        .substring(0,7);
                })
                .filter(Boolean)
        )]
        .sort()
        .reverse();

    periodFilter.innerHTML =
        `<option value="Tümü">Tüm Dönem</option>`;

    periods.forEach(period => {

        const option =
            document.createElement("option");

        option.value = period;

        option.textContent =
            monthLabel(period);

        periodFilter.appendChild(option);
    });
}


/* =========================================================
   FİLTRELENMİŞ VERİ
   ========================================================= */

function getFilteredItems(){

    const type =
        typeFilter.value;

    const category =
        categoryFilter.value;

    const period =
        periodFilter.value;


    return allItems.filter(item => {

        /*
         * BURASI ÖNEMLİ:
         * Firestore'daki değerler:
         *
         * type: "Gelir"
         * type: "Gider"
         */

        if(
            type !== "Tümü" &&
            item.type !== type
        ){
            return false;
        }


        if(
            category !== "Tümü" &&
            item.category !== category
        ){
            return false;
        }


        if(
            period !== "Tümü" &&
            String(item.date)
                .substring(0,7) !== period
        ){
            return false;
        }


        return true;
    });
}


/* =========================================================
   RAPORU OLUŞTUR
   ========================================================= */

function renderReport(){

    const items =
        getFilteredItems();


    /* TOPLAM */

    const total =
        items.reduce(
            (sum,item) =>
                sum + (Number(item.amount) || 0),
            0
        );


    /* AYLIK GRUPLAMA */

    const monthly = {};


    items.forEach(item => {

        if(!item.date){
            return;
        }

        const month =
            String(item.date)
                .substring(0,7);

        if(!monthly[month]){
            monthly[month] = {
                total:0,
                count:0
            };
        }

        monthly[month].total +=
            Number(item.amount) || 0;

        monthly[month].count++;
    });


    const monthKeys =
        Object.keys(monthly)
            .sort()
            .reverse();


    /* AYLIK ORTALAMA */

    const monthlyAverage =
        monthKeys.length
            ? total / monthKeys.length
            : 0;


    /* EN YÜKSEK AY */

    let highest =
        null;

    monthKeys.forEach(month => {

        if(
            !highest ||
            monthly[month].total >
            highest.total
        ){

            highest = {
                month,
                total:
                    monthly[month].total
            };
        }
    });


    /* ÖZET */

    totalValue.textContent =
        money(total);

    averageValue.textContent =
        money(monthlyAverage);

    highestMonth.textContent =
        highest
            ? monthLabel(highest.month)
            : "-";

    transactionCount.textContent =
        items.length;


    /* ALT BAŞLIK */

    distributionSubtitle.textContent =
        `${typeFilter.value} - ${
            periodFilter.value === "Tümü"
                ? "Tüm Dönem"
                : monthLabel(periodFilter.value)
        }`;


    /* AYLIK TABLO */

    if(!monthKeys.length){

        monthlyTable.innerHTML = `
            <div class="empty">
                Bu filtrelere uygun kayıt bulunamadı.
            </div>
        `;

    }else{

        let html = `
            <table>
                <thead>
                    <tr>
                        <th>Ay</th>
                        <th class="amount">Tutar</th>
                        <th>İşlem Sayısı</th>
                    </tr>
                </thead>
                <tbody>
        `;


        monthKeys.forEach(month => {

            html += `
                <tr class="month-row">

                    <td>
                        ${monthLabel(month)}
                    </td>

                    <td class="amount">
                        ${money(monthly[month].total)}
                    </td>

                    <td>
                        ${monthly[month].count}
                    </td>

                </tr>
            `;
        });


        html += `
                </tbody>
            </table>
        `;

        monthlyTable.innerHTML = html;
    }


    /* İŞLEMLER */

    const sortedItems =
        [...items].sort(
            (a,b) =>
                String(b.date || "")
                .localeCompare(
                    String(a.date || "")
                )
        );


    if(!sortedItems.length){

        transactionTable.innerHTML = `
            <tr>
                <td colspan="5" class="empty">
                    Kayıt bulunamadı.
                </td>
            </tr>
        `;

    }else{

        transactionTable.innerHTML =
            sortedItems.map(item => {

                const isIncome =
                    item.type === "Gelir";


                return `
                    <tr>

                        <td>
                            ${formatDate(item.date)}
                        </td>

                        <td>
                            ${item.description || "-"}
                        </td>

                        <td>
                            ${item.category || "-"}
                        </td>

                        <td>

                            <span class="
                                type-badge
                                ${
                                    isIncome
                                        ? "type-income"
                                        : "type-expense"
                                }
                            ">
                                ${item.type || "-"}
                            </span>

                        </td>

                        <td class="
                            amount
                            ${
                                isIncome
                                    ? "income"
                                    : "expense"
                            }
                        ">
                            ${money(item.amount)}
                        </td>

                    </tr>
                `;

            }).join("");
    }


    /* DEBUG */

    const incomeCount =
        allItems.filter(
            item => item.type === "Gelir"
        ).length;

    const expenseCount =
        allItems.filter(
            item => item.type === "Gider"
        ).length;

    const incomeTotal =
        allItems
            .filter(item => item.type === "Gelir")
            .reduce(
                (sum,item) =>
                    sum + (Number(item.amount) || 0),
                0
            );

    const expenseTotal =
        allItems
            .filter(item => item.type === "Gider")
            .reduce(
                (sum,item) =>
                    sum + (Number(item.amount) || 0),
                0
            );


    debugInfo.innerHTML = `
        Firebase bağlantısı başarılı.<br><br>

        <strong>Toplam kayıt:</strong>
        ${allItems.length}<br>

        <strong>Gelir kayıtları:</strong>
        ${incomeCount}
        — ${money(incomeTotal)}<br>

        <strong>Gider kayıtları:</strong>
        ${expenseCount}
        — ${money(expenseTotal)}
    `;
}


/* =========================================================
   FİLTRELER
   ========================================================= */

typeFilter.addEventListener(
    "change",
    renderReport
);

categoryFilter.addEventListener(
    "change",
    renderReport
);

periodFilter.addEventListener(
    "change",
    renderReport
);


/* =========================================================
   ÇIKIŞ
   ========================================================= */

async function logout(){

    try{

        await signOut(auth);

        location.href = "index.html";

    }catch(error){

        showError(
            "Çıkış yapılamadı: " +
            error.message
        );
    }
}


/* =========================================================
   AUTH
   ========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            authBar.innerHTML = `
                Giriş yapılmamış.
            `;

            showError(
                "Firebase oturumu bulunamadı. " +
                "Önce ana sayfadan giriş yapın."
            );

            return;
        }


        authBar.innerHTML = `
            ☁️ ${user.displayName || user.email}
            — Firebase'e bağlı

            <button id="logoutButton">
                Çıkış Yap
            </button>
        `;


        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                logout
            );


        try{

            /*
             * FIRESTORE'DAKİ YAPI:
             *
             * users
             *   └── UID
             *        └── items
             */

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const snapshot =
                await getDoc(userRef);


            if(!snapshot.exists()){

                showError(
                    "Firebase'de kullanıcı kaydı bulunamadı."
                );

                return;
            }


            const data =
                snapshot.data();


            /*
             * items dizisini doğrudan alıyoruz.
             */

            const items =
                Array.isArray(data.items)
                    ? data.items
                    : [];


            /*
             * Sadece geçerli kayıtları bırak.
             */

            allItems =
                items
                    .filter(item => item)
                    .map(item => ({
                        ...item,

                        amount:
                            Number(item.amount) || 0,

                        type:
                            String(item.type || "")
                                .trim(),

                        category:
                            String(item.category || "")
                                .trim(),

                        description:
                            String(item.description || "")
                                .trim(),

                        date:
                            String(item.date || "")
                                .trim()
                    }));


            fillCategories();

            fillPeriods();

            /*
             * Varsayılan:
             * Gelir
             */

            typeFilter.value = "Gelir";

            renderReport();


            loading.style.display =
                "none";

            errorBox.style.display =
                "none";

            reportArea.style.display =
                "block";


        }catch(error){

            console.error(
                "Firestore hata:",
                error
            );


            showError(
                "Firebase verileri okunamadı: " +
                error.code +
                " — " +
                error.message
            );
        }
    }
);

</script>

</body>
</html>
